<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Billing & Invoices</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #3b82f6;
            --secondary-glow: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        .glass-navbar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
        }

        .navbar-brand-custom {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Layout styling */
        .dashboard-container {
            flex-grow: 1;
            padding: 40px 20px;
            z-index: 10;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        
        .form-control {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 10px;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-glow);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            color: white;
        }
        
        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-outline-custom:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.4);
            color: white;
        }

        .table-custom {
            color: var(--text-main);
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        
        .table-custom thead th {
            border: none;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        
        .table-custom tbody tr {
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
        }
        
        .table-custom tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }
        
        .table-custom tbody td {
            border: none;
            padding: 15px;
            vertical-align: middle;
        }
        
        .table-custom tbody td:first-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
        
        .table-custom tbody td:last-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        
        .badge-unpaid { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-paid { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg glass-navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="/dashboard">
                <i class="fa-solid fa-soap me-2"></i>CleanTrack
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item me-3 text-muted">
                        Welcome, <strong class="text-white" th:text="${user.fullName}">User FullName</strong>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/dashboard}" class="btn-outline-custom border-0">
                            <i class="fa-solid fa-house me-2"></i>Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Container -->
    <div class="container dashboard-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Billing & Invoices</h2>
                <p class="text-muted">Manage financial records and digital receipts.</p>
            </div>
        </div>
        
        <!-- Admin/Staff Generate Form -->
        <div class="glass-card mb-4" th:if="${user.role == 'ADMIN' || user.role == 'COUNTER_STAFF'}">
            <h5 class="mb-3"><i class="fa-solid fa-file-invoice me-2 text-primary"></i>Generate New Invoice</h5>
            <form onsubmit="generateInvoice(event)" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label class="visually-hidden" for="orderId">Order ID</label>
                    <input type="number" class="form-control" id="orderId" placeholder="Enter Order ID" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary-custom">Generate Bill</button>
                </div>
            </form>
            
            <script>
                function generateInvoice(e) {
                    e.preventDefault();
                    const orderId = document.getElementById('orderId').value;
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/invoices/generate/' + orderId;
                    document.body.appendChild(form);
                    form.submit();
                }
            </script>
        </div>

        <div class="glass-card p-0 overflow-hidden">
            <div class="table-responsive px-3 pb-3">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>Invoice ID</th>
                            <th>Order Ref</th>
                            <th>Amount</th>
                            <th>Date Generated</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop through invoices -->
                        <tr th:each="invoice : ${invoices}">
                            <td><strong class="text-white" th:text="${'#INV-' + invoice.id}">#INV-1</strong></td>
                            <td><a class="text-decoration-none text-primary" th:text="${'#ORD-' + invoice.orderId}">#ORD-1</a></td>
                            <td class="fw-bold text-white" th:text="${'$' + invoice.totalAmount}">$0.00</td>
                            <td th:text="${#temporals.format(invoice.generatedAt, 'MMM dd, yyyy HH:mm')}">Oct 12, 2023</td>
                            <td>
                                <span class="badge badge-unpaid px-3 py-2 rounded-pill" th:if="${invoice.status == 'UNPAID'}">UNPAID</span>
                                <span class="badge badge-paid px-3 py-2 rounded-pill" th:if="${invoice.status == 'PAID'}">PAID</span>
                            </td>
                        </tr>
                        
                        <!-- Empty state -->
                        <tr th:if="${#lists.isEmpty(invoices)}">
                            <td colspan="5" class="text-center py-5">
                                <div class="text-muted mb-3"><i class="fa-solid fa-file-invoice-dollar fa-3x opacity-25"></i></div>
                                <h5>No invoices found</h5>
                                <p class="text-muted">There are no financial records to display.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
