<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Complaint Resolution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255,255,255,0.03);
            --card-border: rgba(255,255,255,0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        .text-muted { color: var(--text-muted) !important; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-navbar {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
        }
        .navbar-brand-custom {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dashboard-container { flex-grow: 1; padding: 40px 20px; }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            margin-bottom: 24px;
        }
        .form-control, .form-select {
            background-color: rgba(15,23,42,0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 10px;
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(15,23,42,0.8);
            border-color: #3b82f6;
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(59,130,246,0.25);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none; color: #fff;
            padding: 10px 20px; border-radius: 10px;
            font-weight: 600; transition: all 0.3s ease;
        }
        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,92,246,0.3); color: white; }
        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 10px 20px; border-radius: 10px;
            font-weight: 600; transition: all 0.3s ease;
        }
        .btn-outline-custom:hover { background: rgba(255,255,255,0.05); color: white; }
        .btn-success-custom {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.4);
            color: #34d399; padding: 6px 14px;
            border-radius: 8px; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s ease; cursor: pointer;
        }
        .btn-success-custom:hover { background: rgba(16,185,129,0.3); }
        .table-custom { color: var(--text-main); border-collapse: separate; border-spacing: 0 10px; }
        .table-custom thead th { border: none; color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .table-custom tbody tr { background: rgba(255,255,255,0.02); transition: all 0.2s ease; }
        .table-custom tbody tr:hover { background: rgba(255,255,255,0.05); }
        .table-custom tbody td { border: none; padding: 15px; vertical-align: middle; }
        .table-custom tbody td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .table-custom tbody td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .badge-open { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .badge-resolved { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg glass-navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="/dashboard">
                <i class="fa-solid fa-soap me-2"></i>CleanTrack
            </a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item me-3 text-muted">
                        Welcome, <strong class="text-white" th:text="${user.fullName}">User</strong>
                    </li>
                    <li class="nav-item">
                        <a href="/dashboard" class="btn-outline-custom border-0">
                            <i class="fa-solid fa-house me-2"></i>Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container dashboard-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Complaint Resolution</h2>
                <p class="text-muted">Submit and track laundry service complaints.</p>
            </div>
        </div>

        <!-- Submit complaint form (customers only) -->
        <div class="glass-card" th:if="${user.role == 'CUSTOMER'}">
            <h5 class="mb-3"><i class="fa-solid fa-circle-exclamation me-2" style="color:#f87171;"></i>Log a Complaint</h5>
            <form th:action="@{/complaints/submit}" method="POST">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label text-muted">Order ID</label>
                        <input type="number" name="orderId" class="form-control" placeholder="e.g. 3" required>
                    </div>
                    <div class="col-md-7">
                        <label class="form-label text-muted">Issue Description</label>
                        <input type="text" name="issueDescription" class="form-control" placeholder="Describe the problem with your order..." required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary-custom w-100">Submit</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Complaints Table -->
        <div class="glass-card p-0 overflow-hidden">
            <div class="table-responsive px-3 pb-3">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Order Ref</th>
                            <th>Description</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th th:if="${user.role != 'CUSTOMER'}">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${complaints}">
                            <td><strong th:text="${'#CMP-' + c.id}"></strong></td>
                            <td><span class="text-primary" th:text="${'#ORD-' + c.orderId}"></span></td>
                            <td th:text="${c.issueDescription}" style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></td>
                            <td th:text="${#temporals.format(c.createdAt, 'MMM dd, yyyy')}"></td>
                            <td>
                                <span class="badge badge-open px-3 py-2 rounded-pill" th:if="${c.status == 'OPEN'}">OPEN</span>
                                <span class="badge badge-resolved px-3 py-2 rounded-pill" th:if="${c.status == 'RESOLVED'}">RESOLVED</span>
                            </td>
                            <td th:if="${user.role != 'CUSTOMER'}">
                                <form th:if="${c.status == 'OPEN'}" th:action="@{/complaints/resolve/{id}(id=${c.id})}" method="POST">
                                    <button type="submit" class="btn-success-custom">
                                        <i class="fa-solid fa-check me-1"></i>Resolve
                                    </button>
                                </form>
                                <span th:if="${c.status == 'RESOLVED'}" class="text-muted small">Closed</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="fa-solid fa-circle-check fa-3x opacity-25 mb-3 d-block text-muted"></i>
                                <h5>No complaints on record</h5>
                                <p class="text-muted">All is well — no open issues.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
