# Database Configuration (Aiven MySQL)
# Set these as environment variables or in a local application-local.properties (gitignored)
spring.datasource.url=${DB_URL:jdbc:mysql://laundry-management-database-0001-web-based-laundry-management-s.a.aivencloud.com:20316/defaultdb?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
