# Database Configuration (Aiven MySQL placeholders)
spring.datasource.url=jdbc:mysql://mysql-aiven-placeholder-host:12345/cleantrack_db?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username=placeholder_user
spring.datasource.password=placeholder_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
